name: LING Release

on:
  push:
    tags: ['ling-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing LING release tag (ling-vVERSION)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable release source
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^ling-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected ling-vVERSION"
            exit 1
          fi
          tag_ref="refs/tags/$TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          revision=$(git rev-parse "$tag_ref^{commit}")
          git merge-base --is-ancestor "$revision" "origin/$DEFAULT_BRANCH"
          version=${TAG#ling-v}
          test "$(git show "$revision:package.json" | jq -r .version)" = "$version"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          # The tagged Windows runtime host uses the Visual Studio 2022 CMake generator.
          - { runner: windows-2022, os: win, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ZCODE_ENV: production
      ZCODE_DESKTOP_DIST_DIR: dist
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64
      - name: Install frozen dependencies
        working-directory: source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build and verify packaged dependencies
        if: runner.os != 'Windows'
        working-directory: source
        run: corepack pnpm --filter @zcode/desktop run bundle --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Build and verify packaged dependencies on Windows
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          # Git Bash's GNU tar treats drive-letter paths as remote archives.
          $env:Path = "$env:SystemRoot\System32;$env:Path"
          corepack pnpm --filter @zcode/desktop run bundle --os $env:TARGET_OS --arch $env:TARGET_ARCH
      - name: Run packaged agent and collect installers
        run: node release-tools/.github/scripts/qualify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ling-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: ling-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ling-*
          path: release-assets
          merge-multiple: true
      - name: Verify the release set and publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          cd release-assets
          assets=()
          for target in mac-arm64 mac-x64 win-x64 linux-x64; do
            prefix="LING-$VERSION-$target"
            jq -e --arg target "$target" --arg version "$VERSION" --arg revision "$REVISION" \
              '.target == $target and .version == $version and .revision == $revision and .agentSmoke == "passed"' \
              "$prefix-report.json" > /dev/null
            assets+=("$prefix-report.json")
            case "$target" in
              mac-*) assets+=("$prefix.dmg") ;;
              win-*) assets+=("$prefix.exe") ;;
              linux-*) assets+=("$prefix.AppImage" "$prefix.deb") ;;
            esac
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            test "$state" = true
          else
            gh release create "$TAG" --draft --prerelease --verify-tag --title "LING $VERSION"
          fi
          while IFS= read -r asset; do
            if [[ "$asset" == */* ]] || [ ! -f "$asset" ]; then
              echo "Unexpected draft asset: $asset"
              exit 1
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release view "$TAG" --json body --jq .body > release-notes.md
          sed -i '/^桌面安装包和原生验证报告待补齐。$/d' release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## 下载与验证

          macOS 提供 Apple Silicon 和 Intel DMG，Windows 提供 x64 安装程序，Linux 提供 x64 AppImage 和 Debian 安装包。安装包附带 SHA-256 校验值和四平台运行验证报告。

          本次为手动安装的预发布版本。macOS 安装包未经 Apple 公证，Windows 安装包未签名。
          NOTES
          gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease
          gh release view "$TAG" --json url,isDraft,assets --jq 'select(.isDraft == false) | .url'
