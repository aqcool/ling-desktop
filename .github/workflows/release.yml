name: LING Release

on:
  push:
    tags: ["ling-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing LING release tag (ling-vVERSION)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      auto_update: ${{ steps.release.outputs.auto_update }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签触发时默认 checkout 会把附注标签改为提交引用，破坏下方校验。
          # 发布来源固定为 main；仓库默认分支仍为旧 master 时也必须包含本次修复。
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable release source
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_BRANCH: main
          LING_SIGNED_RELEASES: ${{ vars.LING_SIGNED_RELEASES }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^ling-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected ling-vVERSION"
            exit 1
          fi
          tag_ref="refs/tags/$TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          revision=$(git rev-parse "$tag_ref^{commit}")
          git merge-base --is-ancestor "$revision" "origin/$RELEASE_BRANCH"
          version=${TAG#ling-v}
          test "$(git show "$revision:package.json" | jq -r .version)" = "$version"
          auto_update=0
          if [[ "$LING_SIGNED_RELEASES" == 1 ]]; then auto_update=1; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "revision=$revision"
            echo "auto_update=$auto_update"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          # The tagged Windows runtime host uses the Visual Studio 2022 CMake generator.
          - { runner: windows-2022, os: win, arch: x64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ZCODE_ENV: production
      ZCODE_DESKTOP_DIST_DIR: dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      ZCODE_AUTO_UPDATE: ${{ needs.prepare.outputs.auto_update }}
      LING_SIGNED_RELEASES: ${{ needs.prepare.outputs.auto_update }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64
      - name: Install frozen dependencies
        working-directory: source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build and verify packaged dependencies
        if: runner.os != 'Windows'
        working-directory: source
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_MAC_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && needs.prepare.outputs.auto_update == '1' && secrets.LING_APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_OS" == mac && "$ZCODE_AUTO_UPDATE" == 1 ]]; then
            : "${CSC_LINK:?Missing LING_MAC_CSC_LINK}"
            : "${CSC_KEY_PASSWORD:?Missing LING_MAC_CSC_KEY_PASSWORD}"
            : "${APPLE_SIGNING_IDENTITY:?Missing LING_MAC_SIGNING_IDENTITY}"
            : "${APPLE_ID:?Missing LING_APPLE_ID}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing LING_APPLE_ID_PASSWORD}"
            : "${APPLE_TEAM_ID:?Missing LING_APPLE_TEAM_ID}"
            export ZCODE_ENABLE_MAC_SIGN=1
          elif [[ "$TARGET_OS" == mac && "$TARGET_ARCH" == x64 ]]; then
            # Intel Runner 上 dmgbuild 两次无法弹出写入中的镜像，改为直接从目录生成安装盘。
            export CUSTOM_DMGBUILD_PATH="$GITHUB_WORKSPACE/release-tools/.github/scripts/build-unsigned-intel-dmg.sh"
          fi
          corepack pnpm --filter @zcode/desktop run bundle --os "$TARGET_OS" --arch "$TARGET_ARCH"
          if [[ "$TARGET_OS" == mac && "$ZCODE_AUTO_UPDATE" == 1 ]]; then
            image="packages/desktop/dist/LING-$RELEASE_VERSION-mac-$TARGET_ARCH.dmg"
            xcrun notarytool submit "$image" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --no-s3-acceleration --wait
            xcrun stapler staple "$image"
          fi
      - name: Build and verify packaged dependencies on Windows
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ needs.prepare.outputs.auto_update == '1' && secrets.LING_WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ needs.prepare.outputs.auto_update == '1' && secrets.LING_WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          # Git Bash's GNU tar treats drive-letter paths as remote archives.
          $env:Path = "$env:SystemRoot\System32;$env:Path"
          # The build invokes powershell.exe; use modules compatible with Windows PowerShell.
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          if ($env:ZCODE_AUTO_UPDATE -eq "1" -and (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing LING_WIN_CSC_LINK or LING_WIN_CSC_KEY_PASSWORD"
          }
          corepack pnpm --filter @zcode/desktop run bundle --os $env:TARGET_OS --arch $env:TARGET_ARCH
      - name: Run packaged agent and collect installers
        run: node release-tools/.github/scripts/qualify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ling-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    concurrency:
      group: ling-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ling-*
          path: release-assets
          merge-multiple: true
      - name: Verify the release set and publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          AUTO_UPDATE: ${{ needs.prepare.outputs.auto_update }}
        run: |
          set -euo pipefail
          cd release-assets
          assets=()
          prerelease=true
          if [[ "$AUTO_UPDATE" == 1 && "$VERSION" != *-* ]]; then prerelease=false; fi
          for target in mac-arm64 mac-x64 win-x64 linux-x64; do
            prefix="LING-$VERSION-$target"
            jq -e --arg target "$target" --arg version "$VERSION" --arg revision "$REVISION" --arg update "$AUTO_UPDATE" \
              '.target == $target and .version == $version and .revision == $revision and .agentSmoke == "passed" and (.updateEnabled // false) == ($update == "1")' \
              "$prefix-report.json" > /dev/null
            assets+=("$prefix-report.json")
            case "$target" in
              mac-*) assets+=("$prefix.dmg") ;;
              win-*) assets+=("$prefix.exe") ;;
              linux-*) assets+=("$prefix.AppImage" "$prefix.deb") ;;
            esac
            if [[ "$AUTO_UPDATE" == 1 ]]; then
              manifest="ling-update-$target.json"
              jq -e --arg version "$VERSION" '.version == $version and (.files | length > 0)' "$manifest" > /dev/null
              assets+=("$manifest")
              if [[ "$target" == mac-* ]]; then assets+=("$prefix.zip"); fi
              for map in "$prefix.zip.blockmap" "$prefix.exe.blockmap"; do
                if [[ -f "$map" ]]; then assets+=("$map"); fi
              done
            fi
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            test "$state" = true
          else
            gh release create "$TAG" --draft --prerelease --verify-tag --title "LING $VERSION"
          fi
          while IFS= read -r asset; do
            if [[ "$asset" == */* ]] || [ ! -f "$asset" ]; then
              echo "Unexpected draft asset: $asset"
              exit 1
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release view "$TAG" --json body --jq .body > release-notes.md
          sed -i '/^桌面安装包和原生验证报告待补齐。$/d' release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## 下载与验证

          macOS 提供 Apple Silicon 和 Intel DMG，Windows 提供 x64 安装程序，Linux 提供 x64 AppImage 和 Debian 安装包。安装包附带 SHA-256 校验值和四平台运行验证报告。

          NOTES
          if [[ "$AUTO_UPDATE" == 1 ]]; then
            printf '%s\n' '已安装支持自动更新的 LING 可从此版本获取更新。旧手动版需先安装一次新版。' >> release-notes.md
          else
            printf '%s\n' '本次为手动安装的预发布版本。macOS 安装包未经 Apple 公证，Windows 安装包未签名。' >> release-notes.md
          fi
          gh release edit "$TAG" --notes-file release-notes.md --draft=false "--prerelease=$prerelease"
          gh release view "$TAG" --json url,isDraft,assets --jq 'select(.isDraft == false) | .url'
