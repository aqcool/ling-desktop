name: LING Release

on:
  push:
    tags: ['ling-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version, e.g. 0.1.0-beta.1 (without ling-v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ling-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Validate version and create release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            node scripts/release-version.mjs "$RELEASE_VERSION"
            tag="ling-v$RELEASE_VERSION"
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag already exists. Re-run its failed workflow to retry a build."
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json desktop/package.json
            if ! git diff --cached --quiet; then git commit -m "chore: release $RELEASE_VERSION"; fi
            git tag -a "$tag" -m "LING $RELEASE_VERSION"
            git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$tag"
          else
            tag="$REF_NAME"
            RELEASE_VERSION="${tag#ling-v}"
            node scripts/release-version.mjs --check "$RELEASE_VERSION"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
          - runner: macos-15-intel
            target: mac-x64
          - runner: windows-2025
            target: win-x64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - run: corepack enable
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64
      - name: Locate pnpm store
        id: store
        run: echo "path=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', 'vendor/**') }}
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/release-version.mjs --check "$RELEASE_VERSION"
      - name: Build, test and qualify the native package
        run: corepack pnpm dist
      - name: Collect installers and qualification report
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "desktop/dist/$TARGET/packaging-report.json" "release-assets/LING-$RELEASE_VERSION-$TARGET-report.json"
          find "desktop/dist/$TARGET" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-assets/ \;
          node scripts/release-assets.mjs release-assets "$RELEASE_VERSION" "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: ling-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@v8
        with:
          pattern: ling-*
          path: release-assets
          merge-multiple: true
      - name: Verify all targets and write checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-assets.mjs release-assets "$RELEASE_VERSION" --all
      - name: Publish only after every native gate passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "LING $RELEASE_VERSION" \
            --notes-file .github/release-notes.md "${args[@]}"
